<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Analyseur de logs</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <div class="container">
      <h1>Log parser</h1>

      <div class="controls">
        <input type="file" id="fileInput" />
        <button onclick="sendFile()">Analyze</button>
      </div>

      <div class="stats-container">
        <div class="table-wrapper">
          <table id="resultTable">
            <tbody>
              <tr>
                <td colspan="2">(No data yet.)</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="table-wrapper">
          <h2>Top 5 IPs</h2>
          <table id="topIpTable">
            <tbody>
              <tr>
                <td colspan="2">(No data yet.)</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="errors">
          <h2>Last 5 Errors</h2>
          <ul id="lastErrors">
            <li>(No data yet.)</li>
          </ul>
        </div>

        <div class="chart-wrapper">
          <h2>Error Histogram</h2>
          <div>
            <button onclick="setPeriod('minute')">Per Minute (60 last)</button>
            <button onclick="setPeriod('hour')">Per Hour (24 last)</button>
            <button onclick="setPeriod('day')">Per Day (7 last)</button>
          </div>
          <canvas id="statsChart"></canvas>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
